<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午夜牌局 · 德州撲克</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c141b;color:#eee9dc;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}small,.muted{color:#a5b5b5}button{cursor:pointer;border:1px solid #516168;border-radius:9px;background:#25343d;color:white;padding:12px 22px;font:inherit}button:hover{filter:brightness(1.2)}button:disabled{opacity:.35;cursor:default}.gold{background:#d8b971;color:#171d20;border-color:#d8b971}.table{margin:28px 0 20px;background:radial-gradient(ellipse,#176c61,#104c45);border:12px solid #384341;box-shadow:0 0 0 3px #a58b59,0 20px 60px #0008;border-radius:180px;min-height:490px;text-align:center;padding:24px}.seat{display:inline-block;min-width:200px}.name{font-size:18px;font-weight:bold}.stack{color:#f1d590;margin:5px}.cards{display:flex;gap:9px;justify-content:center;margin:12px 0;min-height:91px}.card{width:61px;height:86px;border-radius:8px;background:#faf5e9;color:#192b35;box-shadow:0 3px 6px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;font-weight:bold}.red{color:#b83d49}.back{background:repeating-linear-gradient(45deg,#233e59,#233e59 5px,#315773 5px,#315773 8px);border:4px solid #d2ccbd;color:#d8bd82}.empty{background:#ffffff0a;border:1px dashed #ffffff40;box-shadow:none}.middle{margin:15px 0}.pot{font-size:22px;color:#f5dca2}.phase{font-size:12px;letter-spacing:3px;color:#a8d0c3}.controls{text-align:center;min-height:140px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px}input{accent-color:#d8b971;width:220px}#status{font-size:18px;min-height:30px}details{background:#15212a;border-radius:12px;padding:16px;color:#bcc9c9;line-height:1.8}#log{height:100px;overflow:auto;font-size:13px;margin:18px 0;color:#9cacae}footer{text-align:center;color:#768a91;font-size:12px;padding:18px}@media(max-width:600px){main{padding:15px}h1{font-size:20px}.table{border-radius:80px;padding:18px 8px;border-width:7px}.card{width:47px;height:72px;font-size:22px}.cards{min-height:72px;gap:6px}button{padding:11px 14px}header small{display:none}}
</style>
<main><header><div><small>THE MIDNIGHT CLUB</small><h1>午夜牌局 <span style="color:#d8b971">♠</span></h1></div><button id="reset">重新開始</button></header>
<section class="table"><div class="seat"><div class="name">◈ 電腦 <small id="dealer1"></small></div><div class="stack" id="stack1"></div><div class="cards" id="hand1"></div></div><div class="middle"><div class="phase" id="phase"></div><div class="cards" id="board"></div><div class="pot" id="pot"></div></div><div class="seat"><div class="cards" id="hand0"></div><div class="name">你 <small id="dealer0"></small></div><div class="stack" id="stack0"></div></div></section>
<section class="controls"><div id="status" aria-live="polite"></div><div class="actions"><button id="fold">棄牌</button><button id="call">過牌</button><button class="gold" id="raise">加注</button><button id="allin">全押</button><button class="gold" id="next">發下一手 →</button></div><div id="slider"><label>本輪總下注 <b id="amount"></b> <input id="bet" type="range" step="10"></label></div></section><div id="log" aria-live="polite"></div>
<details><summary>玩法與牌型</summary>使用虛擬籌碼，與一名電腦玩家對戰。每人起始 2,000，盲注 10 / 20。莊家先下小盲並在翻牌前先行動，翻牌後由大盲先行動。用兩張手牌與五張公牌選出最佳五張。<br>牌型由大到小：同花順、四條、葫蘆、同花、順子、三條、兩對、一對、高牌。A 可組成 A2345。平手平分底池，奇數籌碼給大盲。加注滑桿表示本輪下注的總額。單挑下注以對手可跟注的籌碼為上限；全押後自動發完公牌。電腦只使用自己的手牌與已公開的公牌作決策。</details><footer>免費單機練習 · 無真金交易 · 無需登入</footer></main>
<script>
const $=id=>document.getElementById(id),names=['高牌','一對','兩對','三條','順子','同花','葫蘆','四條','同花順'];let s,timer,epoch=0;
function rank5(c){let v=c.map(x=>x.v).sort((a,b)=>b-a),counts={};v.forEach(x=>counts[x]=(counts[x]||0)+1);let g=Object.entries(counts).map(([v,n])=>[n,+v]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);let u=[...new Set(v)];if(u[0]===14)u.push(1);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){st=u[i];break}let fl=c.every(x=>x.s===c[0].s);if(fl&&st)return[8,st];if(g[0][0]===4)return[7,g[0][1],g[1][1]];if(g[0][0]===3&&g[1][0]===2)return[6,g[0][1],g[1][1]];if(fl)return[5,...v];if(st)return[4,st];if(g[0][0]===3)return[3,...g.map(x=>x[1])];if(g[0][0]===2&&g[1][0]===2)return[2,...g.map(x=>x[1])];if(g[0][0]===2)return[1,...g.map(x=>x[1])];return[0,...v]}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}function best(c){let r=[-1];for(let a=0;a<c.length-4;a++)for(let b=a+1;b<c.length-3;b++)for(let d=b+1;d<c.length-2;d++)for(let e=d+1;e<c.length-1;e++)for(let f=e+1;f<c.length;f++){let x=rank5([c[a],c[b],c[d],c[e],c[f]]);if(cmp(x,r)>0)r=x}return r}
function log(x){$('log').innerHTML='<div>'+x+'</div>'+$('log').innerHTML}function pay(p,n){n=Math.min(n,s.chips[p]);s.chips[p]-=n;s.bets[p]+=n;s.pot+=n}function cap(p){return Math.min(s.bets[p]+s.chips[p],s.bets[1-p]+s.chips[1-p])}
function fresh(){clearTimeout(timer);epoch++;s={chips:[2000,2000],dealer:1,number:0};$('log').innerHTML='';deal()}
function deal(){clearTimeout(timer);epoch++;if(s.chips.some(x=>!x)){fresh();return}s.dealer=1-s.dealer;s.number++;s.deck=[];for(let suit=0;suit<4;suit++)for(let v=2;v<=14;v++)s.deck.push({v,s:suit});for(let i=51;i>0;i--){let a=new Uint32Array(1);crypto.getRandomValues(a);let j=a[0]%(i+1);[s.deck[i],s.deck[j]]=[s.deck[j],s.deck[i]]}s.hands=[[s.deck.pop(),s.deck.pop()],[s.deck.pop(),s.deck.pop()]];s.board=[];s.pot=0;s.bets=[0,0];s.stage=0;s.done=false;s.reveal=false;s.pending=new Set([0,1]);s.minRaise=20;s.message='';pay(s.dealer,10);pay(1-s.dealer,20);s.high=Math.max(...s.bets);s.turn=s.dealer;log('第 '+s.number+' 手 · '+(s.dealer===0?'你':'電腦')+' 是莊家');if(s.chips.some(x=>!x)){settleShort();return}render();schedule()}
function settleShort(){let d=s.bets[0]-s.bets[1];if(d){let p=d>0?0:1;s.chips[p]+=Math.abs(d);s.pot-=Math.abs(d);s.bets[p]-=Math.abs(d)}runout()}
function act(p,type,target){if(s.done||s.turn!==p)return;let due=s.high-s.bets[p];if(type==='fold'){log((p?'電腦':'你')+' 棄牌');finish(1-p,'對手棄牌');return}if(type==='raise'){let max=cap(p);target=Math.min(Math.floor(target),max);if(target<=s.high||target<s.high+s.minRaise&&target!==max)return;let old=s.high;pay(p,target-s.bets[p]);s.high=target;s.minRaise=Math.max(s.minRaise,target-old);s.pending=new Set([1-p]);log((p?'電腦':'你')+' 加注至 '+target)}else{pay(p,due);s.pending.delete(p);log((p?'電腦':'你')+(due?' 跟注 '+due:' 過牌'))}if(!s.pending.size){if(s.chips.some(x=>!x)){runout();return}street();return}s.turn=1-p;render();schedule()}
function street(){if(s.stage===3){showdown();return}s.stage++;s.deck.pop();let n=s.stage===1?3:1;while(n--)s.board.push(s.deck.pop());s.bets=[0,0];s.high=0;s.minRaise=20;s.pending=new Set([0,1]);s.turn=1-s.dealer;render();schedule()}
function runout(){while(s.board.length<5){s.deck.pop();let n=s.board.length===0?3:1;while(n--)s.board.push(s.deck.pop())}s.stage=3;showdown()}
function showdown(){s.reveal=true;let a=best([...s.hands[0],...s.board]),b=best([...s.hands[1],...s.board]),d=cmp(a,b);finish(d===0?-1:d>0?0:1,'你：'+names[a[0]]+' ／ 電腦：'+names[b[0]])}
function finish(w,why){s.done=true;let pot=s.pot;if(w<0){s.chips[0]+=Math.floor(pot/2);s.chips[1]+=Math.floor(pot/2);s.chips[1-s.dealer]+=pot%2;s.message='平手，平分底池 · '+why}else{s.chips[w]+=pot;s.message=(w===0?'你贏了！':'電腦獲勝')+' +'+pot+' · '+why}s.pot=0;log(s.message);render()}
function schedule(){clearTimeout(timer);if(s.turn!==1||s.done)return;let stamp=epoch;timer=setTimeout(()=>{if(stamp!==epoch)return;let c=s.hands[1],strength=s.board.length?best([...c,...s.board])[0]/8:(c[0].v===c[1].v?.7:(c[0].v+c[1].v)/36);let due=s.high-s.bets[1],odds=due/(s.pot+due||1),r=Math.random();if(due&&odds>strength+.18&&r<.7)act(1,'fold');else if(r<.15+strength*.25&&cap(1)>=s.high+s.minRaise)act(1,'raise',Math.min(cap(1),s.high+Math.max(s.minRaise,Math.round(s.pot/2/10)*10)));else act(1,'call')},850)}
function card(c,hide=false){if(hide)return '<div class="card back">♠</div>';if(!c)return '<div class="card empty"></div>';return '<div class="card '+([1,2].includes(c.s)?'red':'')+'">'+({11:'J',12:'Q',13:'K',14:'A'}[c.v]||c.v)+'<span>'+['♠','♥','♦','♣'][c.s]+'</span></div>'}
function render(){for(let p=0;p<2;p++){$('hand'+p).innerHTML=s.hands[p].map(c=>card(c,p===1&&!s.reveal)).join('');$('stack'+p).textContent=s.chips[p].toLocaleString()+' 籌碼'+(s.bets[p]?' · 已下注 '+s.bets[p]:'');$('dealer'+p).textContent=s.dealer===p?' Ⓓ 莊家':''}$('board').innerHTML=Array.from({length:5},(_,i)=>card(s.board[i])).join('');$('pot').textContent='底池 '+s.pot.toLocaleString();$('phase').textContent=['PRE-FLOP · 翻牌前','FLOP · 翻牌','TURN · 轉牌','RIVER · 河牌'][s.stage];$('status').textContent=s.done?s.message:s.turn===0?'輪到你了':'電腦思考中…';let live=!s.done&&s.turn===0,due=s.high-s.bets[0],max=cap(0),min=Math.min(max,s.high+s.minRaise);$('call').textContent=due?'跟注 '+Math.min(due,s.chips[0]):'過牌';for(let x of ['fold','call','raise','allin'])$(x).disabled=!live;$('raise').disabled=!live||max<=s.high;$('allin').disabled=!live||max<=s.high;$('next').hidden=!s.done;$('next').textContent=s.chips.some(x=>!x)?'牌局結束 · 再玩一次':'發下一手 →';$('slider').hidden=!live||max<=s.high;$('bet').min=min;$('bet').max=max;$('bet').step=1;$('bet').value=min;$('amount').textContent=min}
$('bet').oninput=()=>$('amount').textContent=$('bet').value;$('fold').onclick=()=>act(0,'fold');$('call').onclick=()=>act(0,'call');$('raise').onclick=()=>act(0,'raise',+$('bet').value);$('allin').onclick=()=>act(0,'raise',cap(0));$('next').onclick=deal;$('reset').onclick=fresh;fresh();
</script></html>
